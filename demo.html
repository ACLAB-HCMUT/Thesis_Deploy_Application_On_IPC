<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localhost QR Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }
        #qrcode {
            margin: 20px auto;
            max-width: 300px;
        }
    </style>
</head>
<body>
    <h1>Localhost QR Generator</h1>
    
    <div>
        <label for="ipInput">Nhập địa chỉ IP:</label>
        <input type="text" id="ipInput" placeholder="Ví dụ: 192.168.1.100">
        
        <label for="portInput">Nhập cổng:</label>
        <input type="text" id="portInput" placeholder="Ví dụ: 3000">
        
        <button onclick="generateQR()">Tạo QR</button>
    </div>
    
    <div id="qrcode"></div>

    <script>
        function generateQR() {
            // Lấy giá trị IP và Port
            const ip = document.getElementById('ipInput').value;
            const port = document.getElementById('portInput').value;
            
            // Kiểm tra nhập liệu
            if (!ip || !port) {
                alert('Vui lòng nhập đầy đủ địa chỉ IP và cổng');
                return;
            }
            
            // Tạo URL localhost
            const localhostUrl = `http://${ip}:${port}`;
            
            // Xóa mã QR cũ (nếu có)
            const qrcodeDiv = document.getElementById('qrcode');
            qrcodeDiv.innerHTML = '';
            
            // Tạo mã QR mới
            new QRCode(qrcodeDiv, {
                text: localhostUrl,
                width: 256,
                height: 256,
                colorDark : "#000000",
                colorLight : "#ffffff",
            });
        }
    </script>
</body>
</html>
